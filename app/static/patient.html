<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>筆談・翻訳 患者用</title>
<style>
  /* 電子ペーパー端末(BOOX等)でも読みやすいよう白黒・高コントラスト */
  html, body { margin:0; height:100%; background:#fff; color:#000; }
  body { display:flex; flex-direction:column; font-family:"BIZ UDGothic","Noto Sans JP","Noto Sans","Hiragino Sans",sans-serif; font-weight:700; }
  #main { flex:1; padding:4vmin 5vmin; overflow:hidden; display:flex; flex-direction:column; }
  #text { flex:1; line-height:1.35; white-space:pre-wrap; overflow-wrap:anywhere; }
  #ja { font-size:4vmin; color:#444; border-top:2px solid #999; padding-top:1.5vmin; margin-top:2vmin; white-space:pre-wrap; font-weight:400; }
  #buttons { display:flex; gap:2vmin; padding:0 5vmin 3vmin; }
  #buttons button { flex:1; font:inherit; font-size:4.5vmin; padding:2.5vmin 1vmin; background:#fff; color:#000; border:4px solid #000; border-radius:14px; }
  #buttons button:active { background:#000; color:#fff; }
  #idle { color:#999; font-size:4vmin; font-weight:400; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div id="main">
  <div id="text"><span id="idle">—</span></div>
  <div id="ja" class="hidden"></div>
</div>
<div id="buttons" class="hidden"></div>
<script>
const $ = id => document.getElementById(id);
const KEYS = ["understood", "again", "question"];

// 文字が枠に収まる最大サイズに合わせる（大きい文字を優先）
function fit() {
  const el = $("text");
  let size = Math.min(window.innerWidth, window.innerHeight) * 0.16;
  el.style.fontSize = size + "px";
  while (size > 18 && (el.scrollHeight > el.clientHeight || el.scrollWidth > el.clientWidth)) {
    size *= 0.92; el.style.fontSize = size + "px";
  }
}

function show(d) {
  $("text").textContent = d.text;
  $("text").lang = d.lang;
  $("ja").textContent = d.japanese || "";
  $("ja").classList.toggle("hidden", !d.japanese);
  const box = $("buttons"); box.innerHTML = "";
  d.labels.forEach((label, i) => {
    const b = document.createElement("button"); b.textContent = label; b.lang = d.lang;
    b.onclick = () => fetch("/api/patient/reply", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key: KEYS[i] }) });
    box.append(b);
  });
  box.classList.remove("hidden");
  requestAnimationFrame(fit);
}
function clear() {
  $("text").innerHTML = '<span id="idle">—</span>';
  $("ja").classList.add("hidden");
  $("buttons").classList.add("hidden");
}

function connect() {
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/patient`);
  ws.onmessage = ev => { const d = JSON.parse(ev.data); d.type === "show" ? show(d) : clear(); };
  ws.onclose = () => setTimeout(connect, 2000);
}
window.addEventListener("resize", fit);
connect();
</script>
</body>
</html>
